<form onsubmit="return false;" data-auto="true" action="{:url('save')}" method="post" class='layui-form layui-card' autocomplete="off">

    <div class="layui-card-body padding-40">
        <label class="layui-form-item block relative">
            <span class="color-green margin-right-10">公告标题</span><span class="nowrap color-desc">NoticeTitle</span>
            <input name="notice_title"   required placeholder="请输入公告标题" value="{:sysconf('notice_title')}" class="layui-input">
        </label>

        <label class="layui-form-item margin-top-20 block relative">
            <span class="color-green margin-right-10">公告内容</span><span class="nowrap color-desc">NoticeContent</span>
            <textarea name="notice_content">{:sysconf('notice_content')}</textarea>
        </label>
        <div class="layui-form-item text-center margin-top-20">
            <button class="layui-btn" type="submit">保存配置</button>
        </div>
    </div>
    <script>
        window.form.render();
        require(['ckeditor', 'angular'], function () {
            window.createEditor('[name="notice_content"]', {height: 500});
        })
    </script>
</form>
